services:

  # ─── Ollama: local LLM server ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    restart: "no"
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull ${AGENT_MODEL:-qwen2.5-coder:14b} &&
        ollama pull ${ANALYSIS_MODEL:-llama3.2:1b}
      "
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # Custom runtime image with Docker CLI (built once, used by openhands)
  runtime-build:
    build:
      context: ./openhands
      dockerfile: Dockerfile.runtime
    image: openhands-runtime-docker:latest
    container_name: runtime-build
    restart: "no"
    entrypoint: ["echo", "Runtime image built"]

  openhands:
    build:
      context: ./openhands
      dockerfile: Dockerfile
      args:
        OPENHANDS_MAX_MESSAGE_CHARS: "${OPENHANDS_MAX_MESSAGE_CHARS:-30000}"
        OPENHANDS_ATTENTION_WINDOW: "${OPENHANDS_ATTENTION_WINDOW:-25}"
    container_name: openhands
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - ./workspace:/opt/workspace_base
    environment:
      LLM_MODEL: "ollama/${AGENT_MODEL:-qwen2.5-coder:14b}"
      LLM_BASE_URL: "http://host.docker.internal:11434"
      LLM_API_KEY: "ollama"
      SANDBOX_RUNTIME_CONTAINER_IMAGE: "openhands-runtime-docker:latest"
      SANDBOX_VOLUMES: "/var/run/docker.sock:/var/run/docker.sock,${PWD}/workspace:/repos"
      WORKSPACE_MOUNT_PATH: "${PWD}/workspace"
      SANDBOX_RUNTIME_BINDING_ADDRESS: "0.0.0.0"
      LOG_ALL_EVENTS: "true"
      SANDBOX_KEEP_RUNTIME_ALIVE: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    restart: "no"
    volumes:
      - ./workspace:/workspace
      - ./results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OPENHANDS_URL: "http://openhands:3000"
      OLLAMA_URL: "http://host.docker.internal:11434"
      AGENT_MODEL: "${AGENT_MODEL:-qwen2.5-coder:32b}"
      ANALYSIS_MODEL: "${ANALYSIS_MODEL:-qwen2.5-coder:32b}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
      GITHUB_REPOS: "${GITHUB_REPOS:-}"
      RESUME: "${RESUME:-false}"
      MAX_TIMEOUT_MINUTES: "${MAX_TIMEOUT_MINUTES:-60}"
      AGENT_README_MAX_CHARS: "${AGENT_README_MAX_CHARS:-30000}"
      EVENT_SUMMARY_MAX_CHARS: "${EVENT_SUMMARY_MAX_CHARS:-8000}"
      EVENT_OUTPUT_MAX_CHARS: "${EVENT_OUTPUT_MAX_CHARS:-1000}"
      ANALYZER_README_MAX_CHARS: "${ANALYZER_README_MAX_CHARS:-15000}"
      ANALYZER_OUTPUT_MAX_CHARS: "${ANALYZER_OUTPUT_MAX_CHARS:-20000}"
    depends_on:
      openhands:
        condition: service_healthy
      runtime-build:
        condition: service_completed_successfully

volumes:
  ollama_data:
    driver: local
